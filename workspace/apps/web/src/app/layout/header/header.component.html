<header class="header">
  <div class="header__left">
    <!-- Mobile menu toggle -->
    <button
      pButton
      pRipple
      type="button"
      icon="pi pi-bars"
      class="p-button-text header__menu-btn"
      (click)="toggleSidebar.emit()"
      aria-label="Toggle sidebar"
    ></button>

    <!-- Logo (mobile only) -->
    <a routerLink="/" class="header__logo md:hidden">
      <span class="header__logo-icon">
        <i class="pi pi-book"></i>
      </span>
      <span class="header__logo-text">Tutor Desk</span>
    </a>
  </div>

  <div class="header__center">
    <!-- Search (placeholder for future) -->
    <div class="header__search hidden md:flex">
      <i class="pi pi-search"></i>
      <input
        type="text"
        placeholder="Search..."
        class="header__search-input"
      />
      <kbd class="header__search-kbd">⌘K</kbd>
    </div>
  </div>

  <div class="header__right">
    <!-- Notifications -->
    <button
      pButton
      pRipple
      type="button"
      icon="pi pi-bell"
      class="p-button-text"
      pBadge
      value="3"
      severity="danger"
      aria-label="Notifications"
    ></button>

    <!-- Theme toggle -->
    <button
      pButton
      pRipple
      type="button"
      [icon]="darkMode() ? 'pi pi-sun' : 'pi pi-moon'"
      class="p-button-text"
      (click)="toggleTheme()"
      aria-label="Toggle theme"
    ></button>

    <!-- User menu -->
    <div class="header__user">
      <p-avatar
        icon="pi pi-user"
        shape="square"
        styleClass="td-avatar td-tone-primary"
        (click)="userMenu.toggle($event)"
        class="cursor-pointer"
        style="border-radius: var(--r-sm);"
      />
      <p-menu
        #userMenu
        [model]="userMenuItems"
        [popup]="true"
        appendTo="body"
      />
    </div>
  </div>
</header>
