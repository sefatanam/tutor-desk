name: Release

# Triggered when you push a version tag: git tag v1.2.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ── Build & push Docker images ───────────────────────────────────────────────
  build-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build Go API image ────────────────────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .                           # workspace root (go.mod is here)
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tutordesk-api:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tutordesk-api:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms: linux/amd64

      # ── Build Angular SSR web image ───────────────────────────────────────
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .                           # workspace root (Nx needs full tree)
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tutordesk-web:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tutordesk-web:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms: linux/amd64

  # ── Roll out to all customers on VPS ────────────────────────────────────────
  rollout:
    name: Rolling update — all customers
    needs: build-push
    runs-on: ubuntu-latest
    environment: production          # requires manual approval in GitHub settings

    steps:
      - name: SSH and run rolling update
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            /opt/tutordesk/scripts/update.sh ${{ needs.build-push.outputs.version }} all
